name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  web-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm -r run typecheck

      - name: Build frontend
        run: pnpm --filter snooptrade build

      - name: Test frontend
        run: pnpm test

  backend-sanity:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        run: |
          if [ -d backend/tests ] && find backend/tests -type f -name "test_*.py" -print -quit | grep -q .; then
            PYTHONPATH=backend pytest -q backend/tests
          else
            echo "No backend tests found; skipping pytest."
          fi

      - name: Compile backend sources
        run: |
          python -m compileall backend/app.py backend/database backend/models backend/routers backend/services backend/utils

      - name: Run API integration tests with MongoDB
        run: PYTHONPATH=backend pytest -q backend/integration_tests
